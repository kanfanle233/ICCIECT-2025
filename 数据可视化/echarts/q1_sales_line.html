<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>202314109方昕哲</title>
  <script src="./echarts.min.js"></script>

  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    #main {
      width: 800px;
      height: 500px;
      margin: 30px auto;
    }
  </style>
</head>

<body>
  <div id="main"></div>

  <script>
    var chart = echarts.init(document.getElementById("main"));

    var option = {
      title: {
        text: "202314109方昕哲图书销售量",
        left: "center"
      },

      tooltip: {
        trigger: "axis"
      },

      legend: {
        data: ["商家A", "商家B"],
        top: 40
      },

      xAxis: {
        type: "category",
        data: ["哲学", "历史", "教育", "科技", "文学", "经济"]
      },

      yAxis: {
        type: "value",
        name: "销售量"
      },

      series: [
        {
          name: "商家A",
          type: "line",
          data: [25, 20, 36, 40, 75, 90],
          itemStyle: {
            color: "red"
          }
        },
        {
          name: "商家B",
          type: "line",
          data: [35, 26, 45, 50, 35, 66],
          itemStyle: {
            color: "green"
          }
        }
      ]
    };

    chart.setOption(option);
  </script>
</body>
</html>
