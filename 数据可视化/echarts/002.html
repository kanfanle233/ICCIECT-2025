<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
<head>
  <meta charset="utf-8">
  <title>多维数据平行坐标图</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <script type="text/javascript">
    var dom = document.getElementById('container');
    var myChart = echarts.init(dom, null, {
      renderer: 'canvas',
      useDirtyRect: false
    });
    
    myChart.showLoading();

    // 动态请求高维数据源，支持动态自适应 title(表头)
    $.get('high_dimendinal_data1.csv', function(csvText) {
      myChart.hideLoading();
      
      var lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return;

      var header = lines[0].split(',');
      var cityColIndex = header.length - 1; // 假设最后一列是用于分组的"城市"或者类似实体

      var parsedRows = [];
      for (var i = 1; i < lines.length; i++) {
        var line = lines[i].trim();
        if(!line) continue;
        parsedRows.push(line.split(','));
      }

      // 动态推断每个维度是数值型还是分类型（只检测非最后一列的维度）
      var isCategory = [];
      for (var j = 0; j < cityColIndex; j++) {
        var firstVal = parsedRows[0][j];
        // 如果无法被转成有效数字，则认为是类别名称字符串
        if (isNaN(parseFloat(firstVal))) {
           isCategory.push(true);
        } else {
           isCategory.push(false);
        }
      }

      // 按最后一列进行分组聚合，如 北京、上海、广州等
      var groupedData = {};
      var categoriesSet = {}; 
      for(var j = 0; j < cityColIndex; j++) {
         if (isCategory[j]) {
            categoriesSet[j] = new Set();
         }
      }

      for (var i = 0; i < parsedRows.length; i++) {
        var cols = parsedRows[i];
        var groupKey = cols[cityColIndex];
        if (!groupedData[groupKey]) {
            groupedData[groupKey] = [];
        }
        
        var rowData = [];
        for (var j = 0; j < cityColIndex; j++) {
           var val = cols[j];
           if (isCategory[j]) {
              rowData.push(val);
              categoriesSet[j].add(val);
           } else {
              rowData.push(parseFloat(val));
           }
        }
        groupedData[groupKey].push(rowData);
      }

      // 根据动态推断的类型配置 parallelAxis
      var parallelAxis = [];
      var firstNumericDim = 0;
      var foundNumeric = false;

      for (var j = 0; j < cityColIndex; j++) {
         var axisDef = {
            dim: j,
            name: header[j], // 动态绑定表头
            nameLocation: 'end'
         };
         if (isCategory[j]) {
            axisDef.type = 'category';
            axisDef.data = Array.from(categoriesSet[j]).reverse(); // 略微反转以更好地迎合显示
         } else {
            if (!foundNumeric) {
               firstNumericDim = j;
               foundNumeric = true;
            }
         }
         parallelAxis.push(axisDef);
      }

      // 组装系列数据 Series
      var series = [];
      var legendData = [];
      var lineStyle = { width: 1, opacity: 0.5 };
      
      for (var group in groupedData) {
         legendData.push(group);
         series.push({
            name: group,
            type: 'parallel',
            lineStyle: lineStyle,
            data: groupedData[group]
         });
      }
      
      var option = {
        backgroundColor: '#333',
        legend: {
          bottom: 30,
          data: legendData,
          itemGap: 20,
          textStyle: {
            color: '#fff',
            fontSize: 14
          }
        },
        tooltip: {
          padding: 10,
          backgroundColor: '#222',
          borderColor: '#777',
          borderWidth: 1
        },
        parallelAxis: parallelAxis,
        visualMap: {
          show: true,
          min: 0,
          max: 300, 
          dimension: firstNumericDim,
          inRange: {
            color: ['#d94e5d', '#eac736', '#50a3ba'].reverse()
          }
        },
        parallel: {
          left: '5%',
          right: '18%',
          bottom: 100,
          parallelAxisDefault: {
            type: 'value',
            nameLocation: 'end',
            nameGap: 20,
            nameTextStyle: {
              color: '#fff',
              fontSize: 12
            },
            axisLine: {
              lineStyle: {
                color: '#aaa'
              }
            },
            axisTick: {
              lineStyle: {
                color: '#777'
              }
            },
            splitLine: {
              show: false
            },
            axisLabel: {
              color: '#fff'
            }
          }
        },
        series: series
      };
      
      // 添加隐藏的水印配置（混淆版），使得直接在代码中搜索或替换很难找到
      var _0x4f2a=['\x67\x72\x61\x70\x68\x69\x63','\x74\x65\x78\x74','\x63\x65\x6e\x74\x65\x72','\x72\x67\x62\x61\x28\x32\x35\x35\x2c\x32\x35\x35\x2c\x32\x35\x35\x2c\x30\x2e\x31\x32\x29'];
      option[_0x4f2a[0]]=[{type:_0x4f2a[1],left:_0x4f2a[2],top:_0x4f2a[2],z:-1,style:{fill:_0x4f2a[3],text:String.fromCharCode(50,48,50,51,49,52,49,48,57,26041,120,122),font:'bold 120px sans-serif'}}];

      myChart.setOption(option);
    });

    window.addEventListener('resize', myChart.resize);
  </script>
</body>
</html>
