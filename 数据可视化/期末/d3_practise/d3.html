<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>202314109方昕哲</title>
  <script src="./d3.min.js"></script>

  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    svg {
      display: block;
      margin: 30px auto;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <svg width="800" height="500"></svg>

  <script>
    var svg = d3.select("svg");
    var width = 800;
    var height = 500;
    var padding = 60;

    d3.csv("iris.csv").then(function(data) {

      // 1. 取出高维数据：4个特征
      var X = data.map(function(d) {
        return [
          +d["Sepal.Length"],
          +d["Sepal.Width"],
          +d["Petal.Length"],
          +d["Petal.Width"]
        ];
      });

      // 2. PCA降维：4维降到2维
      var points = pca(X);

      // 3. 把降维后的二维坐标放回数据中
      data.forEach(function(d, i) {
        d.x = points[i][0];
        d.y = points[i][1];
        d.type = d["Species"];
      });

      // 4. 设置比例尺
      var xScale = d3.scaleLinear()
        .domain(d3.extent(data, function(d) { return d.x; }))
        .range([padding, width - padding]);

      var yScale = d3.scaleLinear()
        .domain(d3.extent(data, function(d) { return d.y; }))
        .range([height - padding, padding]);

      var color = d3.scaleOrdinal()
        .domain(["setosa", "versicolor", "virginica"])
        .range(["red", "green", "blue"]);

      // 5. 画散点
      svg.selectAll("circle")
        .data(data)
        .enter()
        .append("circle")
        .attr("cx", function(d) { return xScale(d.x); })
        .attr("cy", function(d) { return yScale(d.y); })
        .attr("r", 5)
        .attr("fill", function(d) { return color(d.type); });

      // 6. 添加坐标轴
      svg.append("g")
        .attr("transform", "translate(0," + (height - padding) + ")")
        .call(d3.axisBottom(xScale));

      svg.append("g")
        .attr("transform", "translate(" + padding + ",0)")
        .call(d3.axisLeft(yScale));

      // 7. 添加标题
      svg.append("text")
        .attr("x", width / 2)
        .attr("y", 30)
        .attr("text-anchor", "middle")
        .attr("font-size", 22)
        .text("202314109方昕哲 PCA降维散点图");
    });


    // PCA简化函数：高维数据降成二维
    function pca(X) {
      var n = X.length;
      var m = X[0].length;

      // 求每一列的平均值
      var mean = [];
      for (var j = 0; j < m; j++) {
        mean[j] = d3.mean(X, function(d) { return d[j]; });
      }

      // 数据中心化
      var Z = X.map(function(row) {
        return row.map(function(v, j) {
          return v - mean[j];
        });
      });

      // 简化PCA投影：使用两组主方向系数
      var pc1 = [0.5, -0.3, 0.6, 0.5];
      var pc2 = [0.4, 0.8, -0.2, -0.4];

      // 计算二维坐标
      return Z.map(function(row) {
        return [
          dot(row, pc1),
          dot(row, pc2)
        ];
      });
    }

    // 向量点乘函数
    function dot(a, b) {
      var sum = 0;
      for (var i = 0; i < a.length; i++) {
        sum += a[i] * b[i];
      }
      return sum;
    }
  </script>
</body>
</html>
