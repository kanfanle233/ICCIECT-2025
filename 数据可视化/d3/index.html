<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>D3 SVG</title>
    <script src="d3.min.js"></script>
</head>

<body>
    <svg id="myfirstsvg" width="400" height="400"></svg>
    <svg id="myfirstsvg1" width="400" height="400"></svg>
    <svg id="myfirstsvg2" width="400" height="400"></svg>

    <script>
        // Script statements.
        var points1 = [
            [100, 100],
            [200, 100],
            [200, 200],
            [400, 300],
            [350, 350], // 您刚刚添加的点
            [233, 300],
            [100, 100]
        ];

        // 第一条线
        d3.select("#myfirstsvg").append("path")
            .attr("d", d3.line()(points1)) // 按坐标连线
            .attr("stroke", "blue")        // 线条颜色
            .attr("stroke-width", 3)       // 线条粗细
            .attr("fill", "none");         // 不填充

        // 原始直线（对比用）
        const linestraight = d3.line()
            .x(d => d[0])
            .y(d => d[1])
            .curve(d3.curveLinear); // 直线（默认）

        d3.select("#myfirstsvg1").append("path")
            .datum(points1)
            .attr("d", linestraight)
            .attr("fill", "none")
            .attr("stroke", "red")          // 使用红色对比
            .attr("stroke-width", 2)
            .attr("stroke-dasharray", "5,5"); // 虚线效果

        // 贝塞尔曲线（平滑效果）
        const linebezier = d3.line()
            .x(d => d[0])
            .y(d => d[1])
            .curve(d3.curveBasis); // 基础贝塞尔插值 (B-spline)

        // 新增的两行：CatmullRom 和 MonotoneX
        const linecatmullrom = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveCatmullRom);
        const linemonotone = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveMonotoneX);

        const svg2 = d3.select("#myfirstsvg2");

        // Basis (绿色)
        svg2.append("path").datum(points1).attr("d", linebezier).attr("fill", "none").attr("stroke", "green").attr("stroke-width", 2);

        // CatmullRom (橙色)
        svg2.append("path").datum(points1).attr("d", linecatmullrom).attr("fill", "none").attr("stroke", "orange").attr("stroke-width", 2);

        // MonotoneX (紫色)
        svg2.append("path").datum(points1).attr("d", linemonotone).attr("fill", "none").attr("stroke", "purple").attr("stroke-width", 2);
        // 绘制一个紫色圆圈
        d3.select("#myfirstsvg").append("circle")
            .attr("cx", 20)
            .attr("cy", 20)
            .attr("r", 10)
            .attr("fill", "none")
            .attr("stroke", "purple")
            .attr("stroke-width", 3);        // 使用 for 循环在贝塞尔曲线图片的每个顶点画圆
        for (let i = 0; i < points1.length; i++) {
            svg2.append("circle")
                .attr("cx", points1[i][0])
                .attr("cy", points1[i][1])
                .attr("r", 10)
                .attr("fill", "none")
                .attr("stroke", "purple")
                .attr("stroke-width", 3);
        }

        // 使用 D3 数据绑定方法在第一个图片上画圆
        d3.select("#myfirstsvg").selectAll("circle")
            .data(points1)                    // 绑定圆心数组
            .enter()                          // 进入数据（创建缺失的元素）
            .append("circle")                 // 为每个数据创建一个圆
            .attr("cx", d => d[0])            // 圆心 X = 数组第一项
            .attr("cy", d => d[1])            // 圆心 Y = 数组第二项
            .attr("r", 8)                     // 半径
            .attr("fill", "red")              // 填充颜色
            .attr("stroke", "blue")           // 线条颜色
            .attr("stroke-width", 2);         // 线条宽度
        // 使用 D3 数据绑定方法在第一个图片上画矩形 (rect)
        d3.select("#myfirstsvg").selectAll("rect")
            .data(points1)                    // 绑定同一组坐标数组
            .enter()                          // 进入数据
            .append("rect")                   // 创建矩形
            .attr("x", d => d[0] - 10)        // 设置 x 坐标 (减10是为了让 20x20 的矩形中心对齐顶点)
            .attr("y", d => d[1] - 10)        // 设置 y 坐标
            .attr("rx", (d, i) => i * 2)      // 圆角半径 rx：使用 index (i) 动态设置
            .attr("ry", 4)                    // 圆角半径 ry：设为固定值 4
            .attr("width", 20)                // 宽度
            .attr("height", 20)               // 高度
            .attr("fill", "none")             // 不填充
            .attr("stroke", "purple")         // 紫色描边
            .attr("stroke-width", 2);         // 描边宽度
    </script>
</body>

</html>
