<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Iris - Advanced Dimensionality & Clustering Dashboard</title>
  <script src="../d3.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg: #0f172a;
      --bg-panel: rgba(30, 41, 59, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: rgba(255, 255, 255, 0.1);
      --cluster-0: #ef4444; /* red */
      --cluster-1: #3b82f6; /* blue */
      --cluster-2: #f59e0b; /* amber */
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05), transparent 25%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    select, button {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }

    select:hover, button:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 24px;
      padding: 32px 40px;
      flex: 1;
    }

    .panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .panel.full-width {
      grid-column: 1 / -1;
    }

    .panel h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel h2::before {
      content: '';
      display: block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 2px;
    }

    .chart-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 350px;
      position: relative;
    }

    /* SVG Styling */
    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .domain, .tick line {
      stroke: var(--border);
    }
    
    .tick text {
      fill: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }

    .axis-label {
      fill: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .dot {
      transition: r 0.2s, opacity 0.2s;
    }

    .dot:hover {
      r: 6px;
      stroke: #fff;
      stroke-width: 2px;
      opacity: 1;
    }

    .dot.selected {
      stroke: #fff;
      stroke-width: 1.5px;
      r: 6;
      opacity: 1;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
    }
    
    .dot.unselected {
      opacity: 0.15;
    }

    .lasso-path {
      fill: rgba(56, 189, 248, 0.1);
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-dasharray: 4, 4;
      pointer-events: none;
    }

    .pie-path {
      transition: transform 0.2s, opacity 0.2s;
      stroke: var(--bg-panel);
      stroke-width: 2px;
    }

    .pie-path:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .pie-label {
      fill: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .p-line {
      fill: none;
      stroke-width: 1.5px;
      transition: opacity 0.3s;
    }

    .p-line.selected {
      stroke-width: 2px;
      opacity: 0.9;
    }

    .p-line.unselected {
      opacity: 0.05;
    }

    .dim-label {
      fill: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: grab;
      user-select: none;
      padding: 4px;
      transition: fill 0.2s;
    }

    .dim-label:hover {
      fill: var(--accent);
    }
    
    .dim-label:active {
      cursor: grabbing;
    }

    .stats-bar {
      margin-top: 20px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 24px;
    }

    .stats-bar span strong {
      color: var(--accent);
      font-size: 15px;
    }

  </style>
</head>
<body>

  <header>
    <h1>Iris Data Space</h1>
    <div class="controls">
      <select id="speciesFilter">
        <option value="all">所有物种 All Species</option>
        <option value="setosa">Iris-setosa</option>
        <option value="versicolor">Iris-versicolor</option>
        <option value="virginica">Iris-virginica</option>
      </select>
      <select id="clusterFilter">
        <option value="all">所有聚类 All Clusters</option>
        <option value="0">Cluster 0</option>
        <option value="1">Cluster 1</option>
        <option value="2">Cluster 2</option>
      </select>
      <button id="btnLasso">绘图圈选 Lasso Tool</button>
      <button id="btnClear">清空选区 Clear Selection</button>
    </div>
  </header>

  <div class="dashboard">
    
    <div class="panel">
      <h2>主成分降维与聚类散点图 (PCA & K-Means)</h2>
      <div class="chart-container" id="scatterChart"></div>
    </div>

    <div class="panel">
      <h2>选区物种饼图联动 (Species Distribution)</h2>
      <div class="chart-container" id="pieChart"></div>
    </div>

    <div class="panel full-width">
      <h2>平行坐标图维度视图联动 (可左右拖拽坐标轴互换)</h2>
      <div class="chart-container" id="parallelChart"></div>
    </div>

    <div class="panel full-width" style="padding: 0; background: transparent; border: none; box-shadow: none;">
       <div class="stats-bar" id="statsBar">
          <span>总样本数: <strong>0</strong></span>
          <span>当前显示: <strong>0</strong></span>
          <span>圈选数量: <strong>0</strong></span>
          <span>PCA 解释方差: <strong>0%</strong></span>
       </div>
    </div>

  </div>

<script>
// --- Core Math & Algorithms ---
const featureKeys = ["Sepal.Length", "Sepal.Width", "Petal.Length", "Petal.Width"];
let fullData = [];
let filteredData = [];
let brushedIds = new Set();
let isLassoMode = false;
let lassoPolygon = [];
let isDrawing = false;
let currentLassoPath = [];

// Colors
const clusterColor = d3.scaleOrdinal().domain([0, 1, 2]).range(["var(--cluster-0)", "var(--cluster-1)", "var(--cluster-2)"]);
const speciesColor = d3.scaleOrdinal().domain(["setosa", "versicolor", "virginica"]).range(["#2dd4bf", "#818cf8", "#f472b6"]);

// Algorithm: Statistics
const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
const std = (arr, m) => Math.sqrt(arr.reduce((s, v) => s + Math.pow(v - m, 2), 0) / (arr.length - 1)) || 1;
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const matVecMul = (mat, vec) => mat.map(row => dot(row, vec));
const normalize = vec => {
  const n = Math.sqrt(dot(vec, vec)) || 1;
  return vec.map(v => v / n);
};

// Algorithm: PCA Power Iteration
function powerIteration(covMat, iter = 100) {
  let v = normalize(Array(covMat.length).fill(1).map((x, i) => i % 2 ? 1 : -1));
  for (let i = 0; i < iter; i++) v = normalize(matVecMul(covMat, v));
  return { vector: v, value: dot(v, matVecMul(covMat, v)) };
}

function runPCA(data) {
  const values = featureKeys.map(k => data.map(d => d[k]));
  const means = values.map(mean);
  const stds = values.map((v, i) => std(v, means[i]));
  
  // Z-score standardization
  const zData = data.map(d => featureKeys.map((k, i) => (d[k] - means[i]) / stds[i]));
  
  // Covariance matrix
  const p = featureKeys.length;
  const n = data.length;
  if(n <= 1) return 0;
  const cov = Array.from({length: p}, () => Array(p).fill(0));
  for (let i=0; i<p; i++) {
    for (let j=0; j<p; j++) {
      let sum = 0;
      for (let r=0; r<n; r++) sum += zData[r][i] * zData[r][j];
      cov[i][j] = sum / (n - 1);
    }
  }

  // PC1
  const pc1 = powerIteration(cov);
  // Deflate
  const deflated = cov.map((row, i) => row.map((val, j) => val - pc1.value * pc1.vector[i] * pc1.vector[j]));
  // PC2
  const pc2 = powerIteration(deflated);

  data.forEach((d, i) => {
    d.pc1 = dot(zData[i], pc1.vector);
    d.pc2 = dot(zData[i], pc2.vector);
  });

  const totalVar = cov.reduce((sum, row, i) => sum + row[i], 0);
  return ((pc1.value + pc2.value) / totalVar) * 100;
}

// Algorithm: K-Means
function runKMeans(data, k=3, iter=30) {
  const points = data.map(d => [d.pc1, d.pc2]);
  let centers = points.slice(0, k); // naive init
  let labels = Array(data.length).fill(0);

  for (let t=0; t<iter; t++) {
    labels = points.map(p => {
      let bestDist = Infinity, bestIdx = 0;
      centers.forEach((c, i) => {
        const dist = Math.pow(p[0]-c[0], 2) + Math.pow(p[1]-c[1], 2);
        if (dist < bestDist) { bestDist = dist; bestIdx = i; }
      });
      return bestIdx;
    });

    const sums = Array.from({length: k}, () => [0, 0, 0]);
    points.forEach((p, i) => {
      const idx = labels[i];
      sums[idx][0] += p[0]; sums[idx][1] += p[1]; sums[idx][2]++;
    });
    centers = sums.map(s => s[2] ? [s[0]/s[2], s[1]/s[2]] : centers[0]);
  }

  data.forEach((d, i) => d.cluster = labels[i]);
}

let pcaExpVar = 0;

// --- Chart Instances ---
const charts = {
  scatter: { svg: null, g: null, x: null, y: null, width: 0, height: 0, margin: {top: 20, right: 30, bottom: 40, left: 50} },
  pie: { svg: null, g: null, radius: 0 },
  parallel: { svg: null, g: null, x: null, y: {}, width: 0, height: 0, dims: [] }
};

function initCharts() {
  // Scatter
  const scRect = document.getElementById("scatterChart").getBoundingClientRect();
  charts.scatter.width = scRect.width - charts.scatter.margin.left - charts.scatter.margin.right;
  charts.scatter.height = scRect.height - charts.scatter.margin.top - charts.scatter.margin.bottom;
  
  charts.scatter.svg = d3.select("#scatterChart").append("svg")
    .style("position", "absolute")
    .style("top", 0)
    .style("left", 0);
  charts.scatter.g = charts.scatter.svg.append("g")
    .attr("transform", `translate(${charts.scatter.margin.left},${charts.scatter.margin.top})`);
    
  // Lasso Overlay
  charts.scatter.overlay = charts.scatter.svg.append("rect")
    .attr("width", scRect.width)
    .attr("height", scRect.height)
    .attr("fill", "transparent")
    .style("cursor", "crosshair")
    .style("pointer-events", "none");

  // Pie
  const pieRect = document.getElementById("pieChart").getBoundingClientRect();
  charts.pie.radius = Math.min(pieRect.width, pieRect.height) / 2 * 0.8;
  charts.pie.svg = d3.select("#pieChart").append("svg");
  charts.pie.g = charts.pie.svg.append("g")
    .attr("transform", `translate(${pieRect.width/2},${pieRect.height/2})`);

  // Parallel
  const pRect = document.getElementById("parallelChart").getBoundingClientRect();
  const pMargin = {top: 30, right: 20, bottom: 30, left: 40};
  charts.parallel.width = pRect.width - pMargin.left - pMargin.right;
  charts.parallel.height = pRect.height - pMargin.top - pMargin.bottom;
  charts.parallel.dims = [...featureKeys];
  
  charts.parallel.svg = d3.select("#parallelChart").append("svg");
  charts.parallel.g = charts.parallel.svg.append("g")
    .attr("transform", `translate(${pMargin.left},${pMargin.top})`);
}

// --- Render Logic ---

function updateData() {
  const sFilter = d3.select("#speciesFilter").property("value");
  const cFilter = d3.select("#clusterFilter").property("value");
  
  filteredData = fullData.filter(d => 
    (sFilter === "all" || d.Species === sFilter) &&
    (cFilter === "all" || String(d.cluster) === cFilter)
  );

  // keep brushed if still in filtered, else clear
  const validIds = new Set(filteredData.map(d => d.id));
  brushedIds = new Set([...brushedIds].filter(id => validIds.has(id)));
  
  drawScatter();
  drawPie();
  drawParallel();
  updateStats();
}

function updateStats() {
  const sb = d3.select("#statsBar").selectAll("strong").nodes();
  if(sb.length >= 4) {
    sb[0].innerText = fullData.length;
    sb[1].innerText = filteredData.length;
    sb[2].innerText = brushedIds.size;
    sb[3].innerText = pcaExpVar.toFixed(2) + "%";
  }
}

// Interactivity Check
function getSelectionState(d) {
  if (brushedIds.size === 0) return "normal";
  return brushedIds.has(d.id) ? "selected" : "unselected";
}

function drawScatter() {
  const g = charts.scatter.g;
  g.selectAll("*").remove();

  if(filteredData.length === 0) return;

  const w = charts.scatter.width;
  const h = charts.scatter.height;

  charts.scatter.x = d3.scaleLinear().domain(d3.extent(fullData, d => d.pc1)).nice().range([0, w]);
  charts.scatter.y = d3.scaleLinear().domain(d3.extent(fullData, d => d.pc2)).nice().range([h, 0]);
  
  const x = charts.scatter.x;
  const y = charts.scatter.y;

  g.append("g").attr("transform", `translate(0,${h})`).call(d3.axisBottom(x).ticks(8));
  g.append("g").call(d3.axisLeft(y).ticks(8));

  // Axes labels
  g.append("text").attr("class", "axis-label").attr("x", w).attr("y", h - 6).attr("text-anchor", "end").text("PC1");
  g.append("text").attr("class", "axis-label").attr("x", 12).attr("y", 12).attr("text-anchor", "start").text("PC2");

  const dots = g.selectAll(".dot")
    .data(filteredData, d => d.id)
    .enter()
    .append("circle")
    .attr("class", d => "dot " + getSelectionState(d))
    .attr("cx", d => x(d.pc1))
    .attr("cy", d => y(d.pc2))
    .attr("r", 4)
    .attr("fill", d => clusterColor(d.cluster));

  // Lasso visuals overlay inside graph space
  charts.scatter.pathGroup = g.append("g");
}

function drawPie() {
  const g = charts.pie.g;
  g.selectAll("*").remove();

  const dataToCount = brushedIds.size > 0 ? filteredData.filter(d => brushedIds.has(d.id)) : filteredData;
  const counts = d3.rollups(dataToCount, v => v.length, d => d.Species);
  
  if(counts.length === 0) return;

  const pie = d3.pie().value(d => d[1])(counts);
  const arc = d3.arc().innerRadius(charts.pie.radius * 0.4).outerRadius(charts.pie.radius);
  const arcLabel = d3.arc().innerRadius(charts.pie.radius * 0.6).outerRadius(charts.pie.radius);

  g.selectAll("path")
    .data(pie)
    .enter()
    .append("path")
    .attr("class", "pie-path")
    .attr("d", arc)
    .attr("fill", d => speciesColor(d.data[0]));

  g.selectAll("text")
    .data(pie)
    .enter()
    .append("text")
    .attr("class", "pie-label")
    .attr("transform", d => `translate(${arcLabel.centroid(d)})`)
    .attr("text-anchor", "middle")
    .text(d => `${d.data[0]} (${d.data[1]})`);
}

function drawParallel() {
  const g = charts.parallel.g;
  g.selectAll("*").remove();

  if(filteredData.length === 0) return;

  const w = charts.parallel.width;
  const h = charts.parallel.height;
  const dims = charts.parallel.dims;

  const x = d3.scalePoint().domain(dims).range([0, w]);
  charts.parallel.x = x;

  const y = {};
  dims.forEach(dim => {
    y[dim] = d3.scaleLinear().domain(d3.extent(fullData, d => d[dim])).range([h, 0]);
  });
  charts.parallel.y = y;

  const path = d => d3.line()(dims.map(dim => [x(dim), y[dim](d[dim])]));

  // Draw lines
  const lines = g.selectAll(".p-line")
    .data(filteredData, d => d.id)
    .enter()
    .append("path")
    .attr("class", d => "p-line " + getSelectionState(d))
    .attr("d", path)
    .attr("stroke", d => clusterColor(d.cluster));
    
  charts.parallel.lines = lines;

  // Draw axes
  const axes = g.selectAll(".axis")
    .data(dims)
    .enter()
    .append("g")
    .attr("class", "axis")
    .attr("transform", d => `translate(${x(d)},0)`);

  axes.each(function(d) {
    d3.select(this).call(d3.axisLeft(y[d]).ticks(6));
  });

  // Draggable axes labels
  axes.append("text")
    .attr("class", "dim-label")
    .attr("y", -15)
    .attr("text-anchor", "middle")
    .text(d => d)
    .call(d3.drag()
      .on("start", function(e) {
        d3.select(this).classed("dragging", true);
      })
      .on("drag", function(e, d) {
        const newX = Math.min(w, Math.max(0, e.x));
        d3.select(this.parentNode).attr("transform", `translate(${newX}, 0)`);
      })
      .on("end", function(e, d) {
        d3.select(this).classed("dragging", false);
        const newX = e.x;
        // Find nearest position
        let newIdx = 0;
        let minDiff = Infinity;
        const step = w / (dims.length - 1 || 1);
        for(let i=0; i<dims.length; i++) {
          let diff = Math.abs(newX - i * step);
          if(diff < minDiff) { minDiff = diff; newIdx = i; }
        }
        
        const oldIdx = dims.indexOf(d);
        if(oldIdx !== newIdx) {
          // swap logic
          dims.splice(oldIdx, 1);
          dims.splice(newIdx, 0, d);
          x.domain(dims);
        }
        
        // Final transition redraw
        g.selectAll(".axis").transition().duration(400).attr("transform", d => `translate(${x(d)},0)`);
        lines.transition().duration(400).attr("d", path);
      })
    );
}

function applySelectionState() {
  charts.scatter.g.selectAll(".dot").attr("class", d => "dot " + getSelectionState(d));
  if(charts.parallel.lines) {
    charts.parallel.lines.attr("class", d => "p-line " + getSelectionState(d));
  }
  drawPie();
  updateStats();
}

// --- Lasso Interaction ---

function pointInPolygon(point, vs) {
  let x = point[0], y = point[1];
  let inside = false;
  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    let xi = vs[i][0], yi = vs[i][1];
    let xj = vs[j][0], yj = vs[j][1];
    let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function handleLassoToggle() {
  isLassoMode = !isLassoMode;
  d3.select("#btnLasso").classed("active", isLassoMode);
  charts.scatter.overlay.style("pointer-events", isLassoMode ? "all" : "none");
}

function initLassoEvents() {
  const overlay = charts.scatter.overlay;
  
  overlay.on("mousedown", function(e) {
    if(!isLassoMode) return;
    isDrawing = true;
    const pt = d3.pointer(e, charts.scatter.g.node());
    currentLassoPath = [pt];
    charts.scatter.pathGroup.selectAll("*").remove();
  });

  overlay.on("mousemove", function(e) {
    if(!isDrawing) return;
    const pt = d3.pointer(e, charts.scatter.g.node());
    currentLassoPath.push(pt);
    
    // draw line dynamically
    charts.scatter.pathGroup.selectAll("*").remove();
    charts.scatter.pathGroup.append("path")
      .attr("class", "lasso-path")
      .attr("d", d3.line()(currentLassoPath));
  });

  overlay.on("mouseup", function(e) {
    if(!isDrawing) return;
    isDrawing = false;
    if(currentLassoPath.length < 3) return; // Too few points
    
    // Close polygon
    currentLassoPath.push(currentLassoPath[0]);
    const lineStr = d3.line()(currentLassoPath);
    charts.scatter.pathGroup.selectAll("*").remove();
    charts.scatter.pathGroup.append("path")
      .attr("class", "lasso-path")
      .attr("fill", "rgba(56, 189, 248, 0.1)")
      .attr("d", lineStr);

    lassoPolygon = currentLassoPath;
    
    brushedIds.clear();
    filteredData.forEach(d => {
      const px = charts.scatter.x(d.pc1);
      const py = charts.scatter.y(d.pc2);
      if(pointInPolygon([px, py], lassoPolygon)) {
        brushedIds.add(d.id);
      }
    });

    applySelectionState();
  });
}

// --- Data Loading & Bootstrap ---
d3.csv("iris.csv").then(data => {
  fullData = data.map((d, i) => ({
    id: i,
    "Sepal.Length": +d["Sepal.Length"],
    "Sepal.Width":  +d["Sepal.Width"],
    "Petal.Length": +d["Petal.Length"],
    "Petal.Width":  +d["Petal.Width"],
    Species: d.Species
  }));

  pcaExpVar = runPCA(fullData);
  runKMeans(fullData, 3, 30);
  
  initCharts();
  initLassoEvents();
  updateData();

  // Event Listeners
  d3.select("#speciesFilter").on("change", updateData);
  d3.select("#clusterFilter").on("change", updateData);
  d3.select("#btnLasso").on("click", handleLassoToggle);
  d3.select("#btnClear").on("click", () => {
    brushedIds.clear();
    lassoPolygon = [];
    charts.scatter.pathGroup.selectAll("*").remove();
    applySelectionState();
  });

  // Handle Resize
  window.addEventListener("resize", () => {
    d3.selectAll("svg").remove();
    initCharts();
    initLassoEvents();
    if(lassoPolygon.length > 0) applySelectionState();
    else updateData();
  });
});

</script>
</body>
</html>
