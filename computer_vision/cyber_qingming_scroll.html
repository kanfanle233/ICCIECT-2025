<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博朋克清明上河图长卷</title>
  <style>
    :root {
      --scroll-width: 6800px;
      --scroll-height: 760px;
      --cyan: #23f6ff;
      --pink: #ff2bd6;
      --gold: #ffd36a;
      --green: #78ff8a;
      --ink: #070814;
      --paper: #c8a96a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050611;
      color: #f8fbff;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 43, 214, 0.16), transparent 28%),
        radial-gradient(circle at 85% 16%, rgba(35, 246, 255, 0.16), transparent 30%),
        linear-gradient(180deg, #090b1d 0%, #0b1024 48%, #141021 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.05) 0,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px,
          transparent 6px
        ),
        linear-gradient(90deg, rgba(255, 211, 106, 0.18), transparent 20%, transparent 80%, rgba(255, 211, 106, 0.18));
      mix-blend-mode: screen;
      opacity: 0.28;
      z-index: 4;
    }

    #rainCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
      opacity: 0.72;
    }

    .scroll-world {
      position: absolute;
      top: 50%;
      left: 0;
      width: var(--scroll-width);
      height: var(--scroll-height);
      transform: translate3d(0, -50%, 0);
      animation: longScroll 92s linear infinite;
      will-change: transform;
      filter: drop-shadow(0 28px 60px rgba(0, 0, 0, 0.55));
    }

    .scroll-world:hover {
      animation-play-state: paused;
    }

    @keyframes longScroll {
      from {
        transform: translate3d(0, -50%, 0);
      }
      to {
        transform: translate3d(calc(100vw - var(--scroll-width)), -50%, 0);
      }
    }

    .scroll-art {
      position: absolute;
      inset: 0;
      width: var(--scroll-width);
      height: var(--scroll-height);
      overflow: visible;
    }

    #dynamicLayer,
    #shopHotspots {
      position: absolute;
      inset: 0;
      width: var(--scroll-width);
      height: var(--scroll-height);
      pointer-events: none;
    }

    #shopHotspots {
      z-index: 8;
    }

    #dynamicLayer {
      z-index: 5;
    }

    .shop-hotspot {
      position: absolute;
      pointer-events: auto;
      border: 1px solid transparent;
      cursor: crosshair;
    }

    .shop-hotspot:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .neon-sign {
      position: absolute;
      min-width: 104px;
      padding: 5px 10px 6px;
      border: 1px solid currentColor;
      border-radius: 6px;
      background:
        linear-gradient(180deg, rgba(6, 9, 22, 0.82), rgba(12, 11, 30, 0.62)),
        repeating-linear-gradient(90deg, transparent 0 7px, rgba(255, 255, 255, 0.08) 7px 8px);
      color: var(--cyan);
      box-shadow:
        0 0 10px currentColor,
        inset 0 0 12px rgba(255, 255, 255, 0.12);
      font-size: 15px;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 8px currentColor;
      white-space: nowrap;
      pointer-events: none;
      animation: neonPulse 1.9s ease-in-out infinite, glitchStep 5.7s steps(2, jump-none) infinite;
    }

    .neon-sign:nth-child(3n) {
      color: var(--pink);
    }

    .neon-sign:nth-child(4n) {
      color: var(--gold);
    }

    .neon-sign:nth-child(5n) {
      color: var(--green);
    }

    @keyframes neonPulse {
      0%,
      100% {
        opacity: 0.92;
        filter: brightness(1);
      }
      42% {
        opacity: 0.56;
        filter: brightness(0.7);
      }
      47% {
        opacity: 1;
        filter: brightness(1.8);
      }
      54% {
        opacity: 0.72;
      }
      72% {
        opacity: 1;
      }
    }

    @keyframes glitchStep {
      0%,
      88%,
      100% {
        transform: translate(0, 0);
      }
      90% {
        transform: translate(2px, -1px);
      }
      92% {
        transform: translate(-2px, 1px);
      }
    }

    .air-car {
      position: absolute;
      width: 82px;
      height: 24px;
      border: 1px solid rgba(35, 246, 255, 0.8);
      border-radius: 20px 8px 18px 7px;
      background:
        linear-gradient(90deg, rgba(255, 43, 214, 0.55), rgba(35, 246, 255, 0.78)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.25), transparent);
      box-shadow:
        -28px 0 24px rgba(255, 43, 214, 0.26),
        20px 0 24px rgba(35, 246, 255, 0.34),
        0 0 18px rgba(35, 246, 255, 0.8);
      animation: airDrift var(--speed) linear infinite, hoverBob 2.5s ease-in-out infinite;
      animation-delay: var(--delay), calc(var(--delay) * -0.4);
      opacity: 0.86;
    }

    .air-car::before,
    .air-car::after {
      content: "";
      position: absolute;
      top: 7px;
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    }

    .air-car::before {
      left: -18px;
      background: var(--pink);
      box-shadow: 0 0 14px var(--pink);
    }

    .air-car::after {
      right: -24px;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
    }

    @keyframes airDrift {
      from {
        translate: 180px 0;
      }
      to {
        translate: -420px 0;
      }
    }

    @keyframes hoverBob {
      0%,
      100% {
        margin-top: 0;
      }
      50% {
        margin-top: -10px;
      }
    }

    .holo-ad {
      position: absolute;
      width: 128px;
      min-height: 76px;
      padding: 9px 8px;
      border: 1px solid rgba(35, 246, 255, 0.78);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(35, 246, 255, 0.22), rgba(255, 43, 214, 0.12)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 7px);
      color: #e8ffff;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      text-shadow: 0 0 9px var(--cyan);
      box-shadow: 0 0 22px rgba(35, 246, 255, 0.38), inset 0 0 20px rgba(35, 246, 255, 0.15);
      clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
      animation: holoPulse 2.8s ease-in-out infinite, holoLift 7s ease-in-out infinite;
      animation-delay: var(--delay), calc(var(--delay) * -0.35);
      pointer-events: none;
    }

    .holo-ad::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: -26px;
      height: 26px;
      background: linear-gradient(180deg, rgba(35, 246, 255, 0.35), transparent);
      clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
    }

    @keyframes holoPulse {
      0%,
      100% {
        opacity: 0.36;
        filter: hue-rotate(0deg);
      }
      45% {
        opacity: 0.95;
        filter: hue-rotate(18deg);
      }
      52% {
        opacity: 0.62;
      }
      58% {
        opacity: 1;
      }
    }

    @keyframes holoLift {
      0%,
      100% {
        transform: translateY(0) skewX(-2deg);
      }
      50% {
        transform: translateY(-18px) skewX(2deg);
      }
    }

    .pedestrian {
      position: absolute;
      width: 30px;
      height: 56px;
      animation: walkAcross var(--speed) ease-in-out infinite alternate;
      animation-delay: var(--delay);
      pointer-events: none;
    }

    .pedestrian .body {
      position: absolute;
      left: 9px;
      top: 14px;
      width: 13px;
      height: 25px;
      border: 1px solid rgba(255, 211, 106, 0.7);
      border-radius: 8px 8px 5px 5px;
      background: linear-gradient(180deg, rgba(255, 211, 106, 0.75), rgba(255, 43, 214, 0.58));
      box-shadow: 0 0 11px rgba(255, 43, 214, 0.35);
      animation: bodyBob 0.8s ease-in-out infinite;
    }

    .pedestrian .head {
      position: absolute;
      left: 10px;
      top: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f8d7a3;
      box-shadow: 0 0 9px rgba(255, 211, 106, 0.45);
    }

    .pedestrian .arm,
    .pedestrian .leg {
      position: absolute;
      width: 4px;
      border-radius: 999px;
      transform-origin: top center;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
      animation: limbSwing 0.75s ease-in-out infinite alternate;
    }

    .pedestrian .arm {
      top: 18px;
      height: 20px;
    }

    .pedestrian .arm.left {
      left: 6px;
    }

    .pedestrian .arm.right {
      right: 5px;
      animation-delay: -0.35s;
      background: var(--pink);
      box-shadow: 0 0 9px var(--pink);
    }

    .pedestrian .leg {
      top: 38px;
      height: 18px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .pedestrian .leg.left {
      left: 10px;
      animation-delay: -0.35s;
    }

    .pedestrian .leg.right {
      right: 8px;
    }

    @keyframes walkAcross {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(var(--step));
      }
    }

    @keyframes bodyBob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes limbSwing {
      from {
        rotate: -22deg;
      }
      to {
        rotate: 22deg;
      }
    }

    .drone {
      position: absolute;
      width: 34px;
      height: 18px;
      border: 1px solid rgba(255, 211, 106, 0.88);
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(255, 211, 106, 0.8), rgba(255, 43, 214, 0.65));
      box-shadow: 0 0 16px rgba(255, 211, 106, 0.65);
      animation: dronePatrol var(--speed) ease-in-out infinite alternate, hoverBob 1.7s ease-in-out infinite;
      animation-delay: var(--delay), 0s;
      pointer-events: none;
    }

    .drone::before,
    .drone::after {
      content: "";
      position: absolute;
      top: 7px;
      width: 22px;
      height: 2px;
      background: rgba(35, 246, 255, 0.75);
      box-shadow: 0 0 9px var(--cyan);
    }

    .drone::before {
      left: -23px;
    }

    .drone::after {
      right: -23px;
    }

    @keyframes dronePatrol {
      from {
        transform: translateX(-34px) translateY(0);
      }
      to {
        transform: translateX(42px) translateY(-18px);
      }
    }

    .info-card {
      position: fixed;
      z-index: 20;
      left: 24px;
      top: 24px;
      width: 258px;
      padding: 13px 14px 12px;
      border: 1px solid rgba(35, 246, 255, 0.82);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(7, 10, 28, 0.95), rgba(42, 10, 48, 0.9)),
        repeating-linear-gradient(0deg, rgba(35, 246, 255, 0.08) 0 1px, transparent 1px 5px);
      box-shadow:
        0 0 30px rgba(35, 246, 255, 0.28),
        inset 0 0 22px rgba(255, 43, 214, 0.12);
      color: #f4feff;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .info-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .info-card::before {
      content: "";
      position: absolute;
      left: 10px;
      top: -1px;
      width: 48px;
      height: 2px;
      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);
    }

    .info-title {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: 17px;
      font-weight: 700;
      text-shadow: 0 0 9px rgba(35, 246, 255, 0.78);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
      font-size: 13px;
      color: rgba(236, 246, 255, 0.88);
    }

    .info-row strong {
      color: var(--gold);
      font-weight: 700;
    }

    .hud {
      position: fixed;
      left: 18px;
      bottom: 16px;
      z-index: 15;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 211, 106, 0.46);
      border-radius: 8px;
      background: rgba(7, 8, 20, 0.68);
      box-shadow: 0 0 22px rgba(255, 211, 106, 0.16);
      backdrop-filter: blur(8px);
    }

    .hud-title {
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hud-sub {
      margin-top: 4px;
      color: rgba(229, 244, 255, 0.72);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    @media (max-width: 720px) {
      :root {
        --scroll-height: 690px;
      }

      .scroll-world,
      .scroll-art,
      #dynamicLayer,
      #shopHotspots {
        height: var(--scroll-height);
      }

      .hud {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="赛博朋克风格清明上河图动态长卷">
    <div class="scroll-world" id="world">
      <svg class="scroll-art" id="scrollSvg" viewBox="0 0 6800 760" role="img" aria-label="古风汴河与赛博城市混合的长卷">
        <defs>
          <linearGradient id="paperGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#d5bb7a"/>
            <stop offset="0.36" stop-color="#a78a5c"/>
            <stop offset="0.68" stop-color="#28315b"/>
            <stop offset="1" stop-color="#101634"/>
          </linearGradient>
          <linearGradient id="riverGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#194c73"/>
            <stop offset="0.44" stop-color="#111a3b"/>
            <stop offset="1" stop-color="#070a18"/>
          </linearGradient>
          <linearGradient id="roofGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#47321d"/>
            <stop offset="0.56" stop-color="#9b6731"/>
            <stop offset="1" stop-color="#251821"/>
          </linearGradient>
          <linearGradient id="wallGradient" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#c59b5b"/>
            <stop offset="0.68" stop-color="#614729"/>
            <stop offset="1" stop-color="#241b1a"/>
          </linearGradient>
          <linearGradient id="cyberTower" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#2cf7ff" stop-opacity="0.5"/>
            <stop offset="0.34" stop-color="#7929ff" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#090a16" stop-opacity="0.9"/>
          </linearGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <pattern id="paperNoise" width="90" height="90" patternUnits="userSpaceOnUse">
            <path d="M0 18 C22 11, 30 24, 48 15 S75 11, 90 21" fill="none" stroke="#f4daa2" stroke-opacity="0.12" stroke-width="2"/>
            <path d="M5 64 C28 58, 43 72, 66 61 S84 58, 90 66" fill="none" stroke="#140b10" stroke-opacity="0.11" stroke-width="1.5"/>
          </pattern>
          <pattern id="gridPattern" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M80 0H0V80" fill="none" stroke="#23f6ff" stroke-opacity="0.08" stroke-width="1"/>
          </pattern>
        </defs>

        <rect width="6800" height="760" fill="url(#paperGradient)"/>
        <rect width="6800" height="760" fill="url(#paperNoise)"/>
        <rect width="6800" height="760" fill="url(#gridPattern)" opacity="0.65"/>

          <rect x="4720" y="104" width="102" height="234" fill="url(#cyberTower)" opacity="0.48"/>
          <rect x="5840" y="70" width="78" height="255" fill="url(#cyberTower)" opacity="0.5"/>
          <path d="M0 284 C420 258 710 290 1100 262 C1540 230 1850 284 2260 252 C2740 214 3050 276 3480 252 C3990 224 4290 280 4720 250 C5180 218 5530 270 5980 242 C6330 220 6570 238 6800 218" fill="none" stroke="#23f6ff" stroke-opacity="0.22" stroke-width="2"/>
          <path d="M0 314 C380 292 770 328 1160 300 C1580 268 1890 318 2310 290 C2760 260 3120 324 3560 288 C4030 250 4360 314 4830 286 C5290 256 5670 302 6150 276 C6460 260 6650 270 6800 256" fill="none" stroke="#ff2bd6" stroke-opacity="0.18" stroke-width="2"/>

        <g id="bridge" transform="translate(2740 0)">
          <path d="M0 493 C160 338 360 338 520 493" fill="none" stroke="#302018" stroke-width="34" stroke-linecap="round"/>

          <g fill="#23f6ff" opacity="0.84" filter="url(#glow)">
            <circle cx="72" cy="438" r="4"/>
            <circle cx="150" cy="400" r="4"/>
            <circle cx="260" cy="382" r="5"/>
            <circle cx="372" cy="410" r="4"/>
            <circle cx="452" cy="452" r="4"/>

        </g>

        <g id="boats" opacity="0.95">
          <g transform="translate(620 590)">
            <path d="M0 22 C66 48 168 48 236 22 L204 58 L36 58 Z" fill="#342016"/>
            <path d="M88 16 L126 -82 L162 18 Z" fill="#d2b374" opacity="0.9"/>

            <path d="M24 18 H218" stroke="#23f6ff" stroke-opacity="0.5" stroke-width="3" filter="url(#glow)"/>
          </g>
          <g transform="translate(1700 622) scale(0.82)">
            <path d="M0 22 C66 48 168 48 236 22 L204 58 L36 58 Z" fill="#39271c"/>
            <path d="M80 17 L126 -70 L174 17 Z" fill="#caa96d" opacity="0.86"/>
            <path d="M24 18 H218" stroke="#ff2bd6" stroke-opacity="0.5" stroke-width="3" filter="url(#glow)"/>
          </g>
          <g transform="translate(3920 604) scale(1.05)">
            <path d="M0 22 C66 48 168 48 236 22 L204 58 L36 58 Z" fill="#2f211a"/>
            <path d="M84 18 L126 -86 L170 18 Z" fill="#e1bf75" opacity="0.86"/>
            <path d="M24 18 H218" stroke="#78ff8a" stroke-opacity="0.46" stroke-width="3" filter="url(#glow)"/>
          </g>
          <g transform="translate(5480 634) scale(0.74)">
            <path d="M0 22 C66 48 168 48 236 22 L204 58 L36 58 Z" fill="#382118"/>
            <path d="M88 16 L126 -82 L162 18 Z" fill="#d2b374" opacity="0.86"/>

    const SVG_NS = "http://www.w3.org/2000/svg";

    const infoCard = document.getElementById("infoCard");

    const shops = [

      { x: 1840, y: 354, w: 235, h: 146, name: "赛博药局", rate: "95%", tag: "纳米丸散", stock: "56 格", color: "#78ff8a" },

      { x: 5380, y: 350, w: 235, h: 152, name: "仿宋记忆馆", rate: "94%", tag: "旧梦回放", stock: "22 卷", color: "#ff2bd6" },
      { x: 5740, y: 382, w: 195, h: 118, name: "铜锣传感器行", rate: "97%", tag: "声波预警", stock: "76 面", color: "#78ff8a" },
      { x: 6310, y: 350, w: 215, h: 150, name: "北宋全息书局", rate: "98%", tag: "活字光屏", stock: "31 册", color: "#23f6ff" }

    const holoTexts = [

      "梦境客栈\\n上传宋词一首",

      "义眼升级\\n夜航模式开放",
      "纸马无人机\\n祭扫航线备案",
      "朱雀电池\\n赤火芯降价",
      "云门通行\\n身份印章扫描",
      "河岸热汤\\n仿生胃友好",
      "丝绸铺\\n霓虹锦样本"
    ];

    function svgEl(tag, attrs = {}) {
      const node = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value]) => {
        node.setAttribute(key, value);
      });
      return node;
    }

    function div(className, attrs = {}) {
      const node = document.createElement("div");
      node.className = className;
      Object.entries(attrs).forEach(([key, value]) => {
        if (key === "text") node.textContent = value;
        else if (key === "html") node.innerHTML = value;
        else if (key === "style") {
          Object.entries(value).forEach(([prop, styleValue]) => {
            if (prop.startsWith("--")) node.style.setProperty(prop, styleValue);
            else node.style[prop] = styleValue;
          });
        }
        else node.setAttribute(key, value);
      });
      return node;
    }

    function renderShop(shop, index) {
      const g = svgEl("g", {
        transform: `translate(${shop.x} ${shop.y})`,
        "data-shop-name": shop.name
      });
      const shadow = svgEl("ellipse", {
        cx: shop.w / 2,
        cy: shop.h + 12,
        rx: shop.w * 0.55,
        ry: 20,
        fill: "#05050d",
        opacity: "0.42"
      });
      const wall = svgEl("rect", {
        x: 8,
        y: 0,
        width: shop.w - 16,
        height: shop.h,
        fill: "url(#wallGradient)",
        stroke: "#2b1d16",
        "stroke-width": 2
      });
      const roof = svgEl("path", {
        d: `M-24 4 Q${shop.w / 2} -70 ${shop.w + 24} 4 L${shop.w - 8} 28 Q${shop.w / 2} -28 8 28 Z`,
        fill: "url(#roofGradient)",
        stroke: "#23140f",
        "stroke-width": 3
      });
      const roofNeon = svgEl("path", {
        d: `M3 8 Q${shop.w / 2} -46 ${shop.w - 3} 8`,
        fill: "none",
        stroke: shop.color,
        "stroke-width": 3,
        "stroke-opacity": 0.78,
        filter: "url(#glow)"
      });
      const door = svgEl("path", {
        d: `M${shop.w / 2 - 24} ${shop.h} V${shop.h - 58} Q${shop.w / 2} ${shop.h - 84} ${shop.w / 2 + 24} ${shop.h - 58} V${shop.h} Z`,
        fill: "#080812",
        stroke: "#c08a48",
        "stroke-width": 2
      });
      const lattice = svgEl("g", {
        stroke: "#1a0f12",
        "stroke-width": 2,
        opacity: 0.72
      });
      for (let i = 0; i < 4; i += 1) {
        lattice.appendChild(svgEl("line", { x1: 24 + i * 32, y1: 38, x2: 24 + i * 32, y2: shop.h - 24 }));
      }
      for (let i = 0; i < 3; i += 1) {
        lattice.appendChild(svgEl("line", { x1: 22, y1: 48 + i * 28, x2: Math.min(shop.w - 22, 150), y2: 48 + i * 28 }));
      }
      const awning = svgEl("path", {
        d: `M14 32 H${shop.w - 14} L${shop.w - 34} 54 H34 Z`,
        fill: shop.color,
        opacity: 0.18
      });
      const signBacking = svgEl("rect", {
        x: shop.w / 2 - 56,
        y: 38,
        width: 112,
        height: 30,
        rx: 3,
        fill: "#090a18",
        stroke: shop.color,
        "stroke-width": 2,
        filter: "url(#glow)",
        opacity: 0.84
      });
      const label = svgEl("text", {
        x: shop.w / 2,
        y: 59,
        fill: shop.color,
        "font-size": 13,
        "font-weight": 700,
        "text-anchor": "middle"
      });
      label.textContent = shop.name.slice(0, 6);

      g.append(shadow, wall, lattice, roof, roofNeon, awning, signBacking, label, door);
      if (index % 2 === 0) {
        const sideLamp = svgEl("g", { transform: `translate(${shop.w - 26} 76)` });
        sideLamp.appendChild(svgEl("line", { x1: 0, y1: -28, x2: 0, y2: 34, stroke: "#25120d", "stroke-width": 4 }));
        sideLamp.appendChild(svgEl("circle", { cx: 0, cy: -20, r: 10, fill: shop.color, opacity: 0.58, filter: "url(#glow)" }));
        sideLamp.appendChild(svgEl("path", { d: "M-8 -10 H8 L4 18 H-4 Z", fill: "#d99d52", opacity: 0.7 }));
        g.appendChild(sideLamp);
      }
      shopsLayer.appendChild(g);

      const neon = div("neon-sign", {
        text: shop.name,
        "data-dynamic": "true",
        style: {
          left: `${shop.x + Math.max(18, shop.w / 2 - 72)}px`,
          top: `${shop.y + 42}px`,
          color: shop.color,
          animationDelay: `${-(index % 6) * 0.32}s, ${-index * 0.27}s`
        }
      });
      dynamicLayer.appendChild(neon);

      const hot = div("shop-hotspot", {
        tabindex: "0",
        role: "button",
        "aria-label": `${shop.name} 信息卡`,
        style: {
          left: `${shop.x - 18}px`,
          top: `${shop.y - 78}px`,
          width: `${shop.w + 36}px`,
          height: `${shop.h + 98}px`
        }
      });
      hot.addEventListener("mouseenter", event => showInfo(event, shop, hot));
      hot.addEventListener("pointerenter", event => showInfo(event, shop, hot));
      hot.addEventListener("mousemove", event => moveInfo(event, hot));
      hot.addEventListener("pointermove", event => moveInfo(event, hot));
      hot.addEventListener("mouseleave", hideInfo);
      hot.addEventListener("pointerleave", hideInfo);
      hot.addEventListener("focus", event => showInfo(event, shop, hot));
      hot.addEventListener("click", event => showInfo(event, shop, hot));
      hot.addEventListener("blur", hideInfo);
      hotspots.appendChild(hot);
    }

    function showInfo(event, shop, anchor) {
      infoCard.innerHTML = `
        <h2 class="info-title">${shop.name}</h2>
        <div class="info-row"><span>好评率</span><strong>${shop.rate}</strong></div>
        <div class="info-row"><span>招牌项目</span><strong>${shop.tag}</strong></div>
        <div class="info-row"><span>实时库存</span><strong>${shop.stock}</strong></div>
        <div class="info-row"><span>信用链路</span><strong>已上链</strong></div>
      `;
      infoCard.classList.add("visible");
      moveInfo(event, anchor);
    }

    function moveInfo(event, anchor) {
      const margin = 16;
      const rect = anchor?.getBoundingClientRect?.();
      const clientX = Number.isFinite(event.clientX) ? event.clientX : (rect ? rect.left + rect.width / 2 : margin);
      const clientY = Number.isFinite(event.clientY) ? event.clientY : (rect ? rect.top + rect.height / 2 : margin);
      const x = Math.min(window.innerWidth - 278, Math.max(margin, clientX + 18));
      const y = Math.min(window.innerHeight - 168, Math.max(margin, clientY + 18));
      infoCard.style.left = `${x}px`;
      infoCard.style.top = `${y}px`;
    }

    function hideInfo() {
      infoCard.classList.remove("visible");
    }

    function renderStreetDetails() {
      for (let x = 40; x < 6760; x += 92) {
        const post = svgEl("g", { transform: `translate(${x} ${430 + Math.sin(x / 220) * 18})` });
        post.appendChild(svgEl("line", { x1: 0, y1: -62, x2: 0, y2: 76, stroke: "#221512", "stroke-width": 5 }));
        post.appendChild(svgEl("circle", { cx: 0, cy: -62, r: 7, fill: x % 184 === 0 ? "#ff2bd6" : "#23f6ff", opacity: 0.72, filter: "url(#glow)" }));
        post.appendChild(svgEl("path", { d: "M-14 -42 H14 L8 -18 H-8 Z", fill: "#b87b3b", opacity: 0.72 }));
        streetDetails.appendChild(post);
      }

      for (let x = 80; x < 6700; x += 155) {
        const tree = svgEl("g", { transform: `translate(${x} ${455 + Math.cos(x / 170) * 20})` });
        tree.appendChild(svgEl("path", { d: "M0 70 C4 38 -8 24 -2 0 C8 28 22 42 18 72 Z", fill: "#2e1c11" }));
        tree.appendChild(svgEl("path", { d: "M-40 8 C-8 -34 30 -24 42 8 C30 48 -16 54 -40 8 Z", fill: "#18281d", opacity: 0.86 }));
        tree.appendChild(svgEl("path", { d: "M-30 4 C-3 -24 24 -14 34 8" , fill: "none", stroke: "#78ff8a", "stroke-opacity": 0.24, "stroke-width": 3, filter: "url(#glow)" }));
        streetDetails.appendChild(tree);
      }

      for (let x = 280; x < 6560; x += 310) {
        const market = svgEl("g", { transform: `translate(${x} 512)` });
        market.appendChild(svgEl("path", { d: "M0 0 H118 L96 64 H20 Z", fill: "#261719" }));
        market.appendChild(svgEl("path", { d: "M-10 0 L58 -42 L128 0 Z", fill: "#8d5730" }));
        market.appendChild(svgEl("path", { d: "M4 8 H112", stroke: "#ffd36a", "stroke-width": 3, "stroke-opacity": 0.64, filter: "url(#glow)" }));
        market.appendChild(svgEl("circle", { cx: 28, cy: 32, r: 10, fill: "#23f6ff", opacity: 0.42, filter: "url(#glow)" }));
        market.appendChild(svgEl("circle", { cx: 78, cy: 30, r: 8, fill: "#ff2bd6", opacity: 0.42, filter: "url(#glow)" }));
        streetDetails.appendChild(market);
      }
    }

    function createAirCars() {
      for (let i = 0; i < 16; i += 1) {
        const car = div("air-car", {
          "data-dynamic": "true",
          style: {
            left: `${360 + i * 410 + (i % 3) * 70}px`,
            top: `${120 + (i % 5) * 36}px`,
            "--speed": `${8 + (i % 5) * 1.7}s`,
            "--delay": `${-i * 0.72}s`
          }
        });
        dynamicLayer.appendChild(car);
      }
    }

    function createHolograms() {
      holoTexts.forEach((text, index) => {
        const holo = div("holo-ad", {
          html: text.replace("\\n", "<br>"),
          "data-dynamic": "true",
          style: {

            top: `${205 + (index % 4) * 44}px`,
            "--delay": `${-index * 0.48}s`

        dynamicLayer.appendChild(holo);
      });
    }

    function createPedestrians() {
      for (let i = 0; i < 26; i += 1) {
        const ped = div("pedestrian", {
          "data-dynamic": "true",
          style: {
            left: `${210 + i * 245 + (i % 4) * 28}px`,
            top: `${454 + (i % 5) * 18}px`,
            "--speed": `${3.2 + (i % 6) * 0.55}s`,
            "--delay": `${-i * 0.31}s`,
            "--step": `${i % 2 === 0 ? 54 : -46}px`
          }
        });
        ped.innerHTML = `
          <span class="head"></span>
          <span class="body"></span>
          <span class="arm left"></span>
          <span class="arm right"></span>
          <span class="leg left"></span>
          <span class="leg right"></span>
        `;
        dynamicLayer.appendChild(ped);
      }
    }

    function createDrones() {
      for (let i = 0; i < 10; i += 1) {
        const drone = div("drone", {
          "data-dynamic": "true",
          style: {
            left: `${520 + i * 610}px`,
            top: `${178 + (i % 4) * 68}px`,
            "--speed": `${4.6 + (i % 5) * 0.8}s`,
            "--delay": `${-i * 0.44}s`
          }
        });
        dynamicLayer.appendChild(drone);
      }
    }

    function initCanvasRain() {
      const canvas = document.getElementById("rainCanvas");
      const ctx = canvas.getContext("2d");
      const particles = [];
      const palette = ["#23f6ff", "#ff2bd6", "#ffd36a", "#78ff8a"];

      function resize() {
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * scale);
        canvas.height = Math.floor(window.innerHeight * scale);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        particles.length = 0;
        const count = Math.floor(Math.max(70, window.innerWidth / 12));
        for (let i = 0; i < count; i += 1) {
          particles.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            len: 18 + Math.random() * 44,
            speed: 0.7 + Math.random() * 2.2,
            color: palette[i % palette.length],
            alpha: 0.18 + Math.random() * 0.36
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.globalCompositeOperation = "lighter";
        particles.forEach(p => {
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.len * 0.42, p.y + p.len);
          ctx.stroke();
          p.x -= p.speed * 0.42;
          p.y += p.speed;
          if (p.y > window.innerHeight + 80 || p.x < -90) {
            p.x = Math.random() * window.innerWidth + 60;
            p.y = -60;
          }
        });
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw();
    }

    shops.forEach(renderShop);
    renderStreetDetails();
    createAirCars();
    createHolograms();
    createPedestrians();
    createDrones();
    initCanvasRain();

    const totalDynamic = document.querySelectorAll("[data-dynamic='true']").length;
    dynamicCount.textContent = `动态元素: ${totalDynamic}`;
  </script>
</body>
